<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NetworkLab | Local Control</title>
<style>
:root{--bg:#071018;--panel:#0c1721;--panel2:#101e2a;--line:#1d3342;--text:#e7f0f5;--muted:#78909e;--cyan:#27d7e8;--green:#38d39f;--amber:#f2b84b;--red:#ff6678}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#123040 0,#071018 38%);color:var(--text);font:14px/1.5 Segoe UI,Arial,sans-serif}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);background:#071019;padding:24px 16px}.brand{font-size:20px;font-weight:700;letter-spacing:.08em}.sub{font-size:11px;color:var(--muted);margin-top:2px}.nav{margin-top:34px}.nav button{display:block;width:100%;padding:11px 12px;margin:4px 0;background:transparent;border:0;border-radius:8px;color:#9eb0bb;text-align:left;cursor:pointer}.nav button:hover,.nav button.active{background:#102430;color:var(--cyan)}.main{padding:26px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.title{font-size:25px;font-weight:650}.badge{border:1px solid #285260;color:var(--cyan);padding:6px 10px;border-radius:999px;font-size:11px}.run{background:var(--cyan);color:#041015;border:0;padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(145deg,var(--panel),#0a141d);border:1px solid var(--line);border-radius:12px;padding:18px}.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.09em}.value{font-size:29px;margin-top:8px;font-weight:700}.ok{color:var(--green)}.warn{color:var(--amber)}.danger{color:var(--red)}.section{margin-top:18px;display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.panel-title{font-weight:650;margin-bottom:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.pill{padding:4px 8px;border-radius:999px;font-size:11px}.pill.ok{background:#0d3329}.pill.warn{background:#3a2b12}.activity{display:grid;gap:10px}.event{padding:10px 12px;border-left:2px solid var(--cyan);background:#0b1922}.event small{display:block;color:var(--muted)}.bar{height:6px;background:#172b37;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:var(--cyan)}.footer{margin-top:18px;color:var(--muted);font-size:11px}.hidden{display:none}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:repeat(2,1fr)}.section{grid-template-columns:1fr}.main{padding:18px}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand">NETWORKLAB</div><div class="sub">LOCAL CONTROL SURFACE</div>
<div class="nav">
<button class="active" onclick="show('overview',this)">Overview</button>
<button onclick="show('adapters',this)">Adapters</button>
<button onclick="show('ip',this)">IP Configuration</button>
<button onclick="show('connectivity',this)">Connectivity</button>
<button onclick="show('services',this)">Services</button>
<button onclick="show('diagnostics',this)">Diagnostics</button>
<button onclick="show('evidence',this)">Evidence</button>
</div>
</aside>
<main class="main">
<div class="top"><div><div class="title">NetworkLab</div><div id="clock" class="sub">Loading local lab state...</div></div><div><span class="badge">SOFTWARE-ONLY · READ-ONLY</span> <button class="run" onclick="health()">RUN HEALTH CHECK</button></div></div>
<div id="content"></div>
<div class="footer">Local PowerShell backend · No production-network configuration is performed · Configuration is disabled by lab policy</div>
</main></div>
<script>
let state={};let current='overview';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path){const r=await fetch(path);if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){try{state=await api('/api/state');render()}catch(e){document.getElementById('content').innerHTML='<div class="card danger">Backend error: '+esc(e.message)+'</div>'}}
function render(){
document.getElementById('clock').textContent='Host: '+esc(state.computer)+' · '+new Date().toLocaleString();
const adapters=state.adapters||[], ips=state.ip||[], services=state.services||[], checks=state.connectivity||[];
if(current==='overview') document.getElementById('content').innerHTML=
'<div class="grid">'+card('ADAPTERS UP',adapters.filter(x=>x.status==='Up').length+'/'+adapters.length,'ok')+card('IPv4 CONFIGURED',ips.length,'ok')+card('CONNECTIVITY',checks.filter(x=>x.ok).length+'/'+checks.length,'ok')+card('SERVICES',services.filter(x=>x.status==='Running').length+'/'+services.length,'ok')+'</div>'+
'<div class="section"><div class="card"><div class="panel-title">Lab Health</div><div class="value ok">READY</div><p class="sub">Local inspection endpoints are responding. No network configuration actions are exposed.</p><div class="bar"><span style="width:100%"></span></div></div><div class="card"><div class="panel-title">Recent Activity</div><div class="activity">'+event('State collected','PowerShell native network inventory')+event('Scope verified','Software-only / configuration disabled')+event('Monitoring ready','Loopback target: 127.0.0.1')+'</div></div></div>';
else if(current==='adapters') document.getElementById('content').innerHTML=panelTable('Network Adapters',['Name','Status','Speed','MAC'],adapters.map(x=>[x.name,x.status,x.speed,x.mac]));
else if(current==='ip') document.getElementById('content').innerHTML=panelTable('IP Configuration',['Interface','IPv4','Gateway','DNS'],ips.map(x=>[x.interface,x.ipv4,x.gateway,x.dns]));
else if(current==='connectivity') document.getElementById('content').innerHTML=panelTable('Connectivity Checks',['Target','Address','Result','Latency'],checks.map(x=>[x.target,x.address,x.ok?'<span class="pill ok">PASS</span>':'<span class="pill warn">WARN</span>',x.latency]));
else if(current==='services') document.getElementById('content').innerHTML=panelTable('Infrastructure Services',['Service','Status','Start Type'],services.map(x=>[x.name,x.status,x.startType]));
else if(current==='diagnostics') document.getElementById('content').innerHTML='<div class="card"><div class="panel-title">Diagnostics</div><pre style="white-space:pre-wrap;color:#a9bac4">'+esc(JSON.stringify(state.diagnostics,null,2))+'</pre></div>';
else document.getElementById('content').innerHTML='<div class="card"><div class="panel-title">Evidence</div><p class="sub">Use the PowerShell evidence collector to generate timestamped evidence packages.</p><pre style="color:#a9bac4">powershell\\manage\\Get-NetworkLabEvidence.ps1</pre></div>';
}
function card(l,v,c){return '<div class="card"><div class="label">'+l+'</div><div class="value '+c+'">'+v+'</div></div>'}
function event(a,b){return '<div class="event">'+a+'<small>'+b+'</small></div>'}
function panelTable(t,h,rows){return '<div class="card"><div class="panel-title">'+t+'</div><table class="table"><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x).replace(/&lt;span class="pill ok"&gt;/g,'<span class="pill ok">').replace(/&lt;span class="pill warn"&gt;/g,'<span class="pill warn">').replace(/&lt;\/span&gt;/g,'</span>')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function show(v,b){current=v;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
async function health(){document.querySelector('.run').textContent='RUNNING...';try{await api('/api/health');await load()}finally{document.querySelector('.run').textContent='RUN HEALTH CHECK'}}
load();setInterval(load,15000);
</script>
</body></html>
